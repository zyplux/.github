name: ci

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/setup@v2
        with:
          cache: true
          install: false
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: '3.14'
          enable-cache: true
      - run: pnpm install --frozen-lockfile --no-runtime
      - run: uv sync --locked --all-packages --all-groups
      - run: pnpm run knip
      - run: pnpm run knip --config knip.prod.json
      - run: uv run --no-sync vulture
      - run: pnpm run typecheck
      - run: uv run --no-sync rumdl check
      - run: uv run --no-sync rumdl fmt --check
      - run: pnpm run lint
      - run: pnpm exec prettier --check .
      - run: uv run --no-sync ruff check
      - run: uv run --no-sync ruff format --check
      - run: uv run --no-sync pyrefly check
      - run: pnpm run test
      - run: uv run --no-sync pytest
      - run: uv run --no-sync cerberus
