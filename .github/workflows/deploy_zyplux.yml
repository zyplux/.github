name: deploy_zyplux

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy_zyplux.yml'
      - 'apps/zyplux/**'
      - 'rulesets/copilot-review.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zyplux-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://github-hooks.zyplux.ai
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: zyplux/zyplux/apps/action-setup-pm@setup-pm-v1
      - name: Deploy zyplux
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/zyplux
          secrets: |
            ZYPLUX_APP_ID
            ZYPLUX_APP_PRIVATE_KEY
            ZYPLUX_WEBHOOK_SECRET
        env:
          ZYPLUX_APP_ID: ${{ vars.ZYPLUX_APP_ID }}
          ZYPLUX_APP_PRIVATE_KEY: ${{ secrets.ZYPLUX_APP_PRIVATE_KEY }}
          ZYPLUX_WEBHOOK_SECRET: ${{ secrets.ZYPLUX_WEBHOOK_SECRET }}
      - name: Verify Worker health
        env:
          WORKER_URL: https://github-hooks.zyplux.ai
        run: >-
          curl --fail --show-error --silent
          --retry 3 --retry-all-errors --retry-delay 5 --retry-max-time 30
          --connect-timeout 5 --max-time 10
          "$WORKER_URL/health"
