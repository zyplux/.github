[project]
name = "zyplux-github"
version = "0"
description = "Org-wide reusable CI for the zyplux organization"
requires-python = ">=3.14"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/bot-review-gate"]

[tool.pytest.ini_options]
addopts = "--cov=bot_review_gate --cov-report=term-missing"
testpaths = ["tests/bot-review-gate"]

[tool.coverage.report]
fail_under = 90

[tool.vulture]
paths = ["apps/bot-review-gate/src", "tests/bot-review-gate"]

[dependency-groups]
lint = [
    "ruff>=0.17.1",
    "rumdl>=0.3.0",
    "vulture>=2.16",
    "zyplux-cerberus>=0.25.2",
]
test = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]
type = ["pyrefly>=1.4.0"]
