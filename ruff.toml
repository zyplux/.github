line-length = 120
target-version = "py314"
preview = true

[lint]
select = ["ALL"]
ignore = [
    "missing-trailing-comma", # the formatter owns trailing commas; the rule fights it
    "single-line-implicit-string-concatenation", # the formatter owns implicit string concatenation; the rule fights it
    "D",      # docstrings are optional here — code is written to be self-documenting
    "DOC",    # docstring-section rules only matter once docstrings are mandated (they aren't)
    "missing-copyright-notice", # the project carries no copyright-header convention
]

[lint.per-file-ignores]
"**/tests/**" = [
    "implicit-namespace-package", # the tests tree is deliberately not an importable package (pytest rootdir layout)
    "assert",   # `assert` is pytest's assertion API (production asserts stay flagged)
]
