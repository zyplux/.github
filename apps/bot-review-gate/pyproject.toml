[project]
name = "bot-review-gate"
version = "0"
description = "Gates pull requests on clean reviews from participating Copilot and Codex bots"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "bot_review_gate"
module-root = "src"
